id: redis-ai-idempotent-embedding-ingestion-007
name: Idempotent embedding ingestion
description: |
  Tests that the skill recommends deterministic chunk IDs, content hashes,
  manifests, and stale-vector cleanup for repeatable embedding ingestion.
tags:
  - redis-ai
  - embeddings
  - ingestion
