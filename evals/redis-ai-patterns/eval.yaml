name: redis-ai-patterns-eval
description: |
  Local mock evaluation suite for the redis-ai-patterns skill.
  Prompts cover vector search, RAG, semantic caching, LLM memory, and
  AI agent state patterns using Redis on Azure Managed Redis.
skill: redis-ai-patterns
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.0
    description: Did the skill complete the assigned task without errors?
graders:
  - type: behavior
    name: response_constraints
    config:
      max_tool_calls: 10
      max_duration_ms: 60000
tasks:
  - "tasks/*.yaml"
