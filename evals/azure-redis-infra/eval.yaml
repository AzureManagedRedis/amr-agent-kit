name: azure-redis-infra-eval
description: |
  Local mock evaluation suite for the azure-redis-infra skill.
  Prompts cover Azure Managed Redis provisioning, IaC, private networking,
  security, data access policies, high availability, geo-replication,
  diagnostics, and alerting guidance.
skill: azure-redis-infra
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 0.0
    description: Did the skill complete the assigned task without errors?
graders:
  - type: behavior
    name: response_constraints
    config:
      max_tool_calls: 10
      max_duration_ms: 60000
tasks:
  - "tasks/*.yaml"
