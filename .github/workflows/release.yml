name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate release and publish notes
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --package-lock=false

      - name: Install build tool dependencies
        working-directory: packages/amr-agent-skills-build
        run: npm ci

      - name: Build generated skill artifacts
        run: npm run build

      - name: Validate skill package structure
        run: npm run validate

      - name: Run regression tests
        run: npm test

      - name: Check generated output is current
        run: git ls-files --error-unmatch -- skills/redis-code/AGENTS.md skills/azure-redis-infra/AGENTS.md && git diff --exit-code HEAD

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.ref_name }}' }
          $text = ''
          if (Test-Path 'CHANGELOG.md') {
            $lines = Get-Content -Path 'CHANGELOG.md'
            $capture = $false
            $section = [System.Collections.Generic.List[string]]::new()
            foreach ($line in $lines) {
              if ($line -match '^##\s+') {
                if ($capture) { break }
                $capture = $true
                continue
              }
              if ($capture) { $section.Add($line) }
            }
            $text = ($section -join [Environment]::NewLine).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($text)) { $text = "Release $tag" }
          Set-Content -Path 'release-notes.md' -Value $text -Encoding UTF8

      - name: Create GitHub release
        if: github.event_name == 'push' || github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.ref_name }}' }
          $releasesJson = gh release list --json tagName --limit 1000
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check existing releases.' }
          $releases = $releasesJson | ConvertFrom-Json
          if ($tag -notin @($releases | ForEach-Object { $_.tagName })) {
            gh release create $tag --title $tag --notes-file 'release-notes.md' --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Unable to create release $tag." }
          }
