name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate skills (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --package-lock=false

      - name: Install build tool dependencies
        working-directory: packages/amr-agent-skills-build
        run: npm ci

      - name: Build generated skill artifacts
        run: npm run build

      - name: Validate skill package structure
        run: npm run validate

      - name: Run regression tests
        run: npm test

      - name: Check generated output is current
        run: git ls-files --error-unmatch -- skills/redis-code/AGENTS.md skills/azure-redis-infra/AGENTS.md && git diff --exit-code HEAD

  links:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --root-dir "$GITHUB_WORKSPACE" --no-progress .
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2
          token: ${{ github.token }}
